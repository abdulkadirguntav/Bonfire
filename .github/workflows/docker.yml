name: Docker Build & Health Check

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  docker-build-and-test:
    name: Build Multi-Stage Docker & Verify Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          tags: bonfire:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Run & Healthcheck
        run: |
          docker run -d --name test_bonfire -p 8080:80 bonfire:test
          echo "Waiting for container initialization..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz)
          echo "Healthcheck Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Container health check failed!"
            docker logs test_bonfire
            exit 1
          fi
          echo "Container health check passed successfully!"
          docker stop test_bonfire
          docker rm test_bonfire
